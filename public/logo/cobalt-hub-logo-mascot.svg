<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160" role="img" aria-label="Cobalt Hub logo with magnet mark">
  <defs>
    <linearGradient id="cobaltGradMascot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B3D91" />
      <stop offset="100%" stop-color="#2D6CDF" />
    </linearGradient>
  </defs>

  <!-- Badge -->
  <rect x="8" y="8" width="144" height="144" rx="36" fill="url(#cobaltGradMascot)" />

  <!-- Magnetic field line across the open gap -->
  <path d="M 52 34 A 28 16 0 0 1 108 34"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 7" />

  <!-- Horseshoe magnet body -->
  <path d="M 52 34 L 52 84 A 28 28 0 0 0 108 84 L 108 34"
        fill="none" stroke="url(#cobaltGradMascot)" stroke-width="20" stroke-linecap="round" />

  <!-- Pole-tip bands -->
  <line x1="52" y1="34" x2="52" y2="47" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" />
  <line x1="108" y1="34" x2="108" y2="47" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" />

  <!-- Wordmark -->
  <text x="178" y="98" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-weight="800" font-size="56">
    <tspan fill="#0B3D91">Cobalt</tspan><tspan fill="#2D6CDF"> Hub</tspan>
  </text>
</svg>
