name: Deploy Supabase Migrations

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "supabase/migrations/**"

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Pick project (dev vs production) by branch
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "project_ref=${{ secrets.SUPABASE_PROD_PROJECT_REF }}" >> "$GITHUB_OUTPUT"
            echo "db_password=${{ secrets.SUPABASE_PROD_DB_PASSWORD }}" >> "$GITHUB_OUTPUT"
          else
            echo "project_ref=${{ secrets.SUPABASE_DEV_PROJECT_REF }}" >> "$GITHUB_OUTPUT"
            echo "db_password=${{ secrets.SUPABASE_DEV_DB_PASSWORD }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Link project
        run: supabase link --project-ref "${{ steps.target.outputs.project_ref }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ steps.target.outputs.db_password }}

      - name: Push migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ steps.target.outputs.db_password }}
